name: CodexBar Lite

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-build-test:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install pinned lint tools
        run: ./Scripts/install_lint_tools.sh swiftformat swiftlint
      - name: Check
        run: |
          export PATH="$PWD/.build/lint-tools/bin:$PATH"
          make check
      - name: Test with synthetic accounts
        run: make test
      - name: Package
        run: |
          make release
          "CodexBar Lite.app/Contents/MacOS/CodexBarLite" --render-preview /tmp/codexbar-lite-preview.png
          test -s /tmp/codexbar-lite-preview.png
          ditto -c -k --sequesterRsrc --keepParent "CodexBar Lite.app" CodexBar-Lite-macos.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CodexBar-Lite-macos
          path: CodexBar-Lite-macos.zip
